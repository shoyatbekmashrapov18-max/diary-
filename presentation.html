<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Другая сторона — Презентация</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=IBM+Plex+Mono:wght@400;500;700&family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Другая сторона — всегда ночь */
    :root { --bg: #04070d; --card: #0b1322; --border: #7d8696; --text: #f1f1ee; --muted: #8a93a3; --accent: #f1f1ee; --on-accent: #04070d; --gridline: rgba(255,255,255,0.04); color-scheme: dark; }
    body { overflow: hidden; }
    .arrive { position: fixed; inset: 0; z-index: 10; background: #f1f1ee; pointer-events: none; animation: arrive 1.1s var(--snap) forwards; }
    @keyframes arrive { to { clip-path: circle(0 at 50% 50%); } }
    .stage { min-height: 100vh; display: grid; place-items: center; padding: 32px; position: relative; }
    .tunnel {
      position: absolute; inset: -40%; pointer-events: none; opacity: 0.35;
      background: repeating-radial-gradient(circle at 50% 50%, transparent 0 46px, rgba(241,241,238,0.18) 47px 48px, transparent 49px 96px);
      animation: drift 12s linear infinite;
    }
    @keyframes drift { from { transform: scale(1); } to { transform: scale(1.6) rotate(20deg); } }
    .panel { position: relative; max-width: 980px; width: 100%; border: 2px solid var(--border); background: rgba(11,19,34,0.85); box-shadow: 8px 8px 0 #000; padding: 48px; animation: rise 0.9s var(--ease-out) 0.6s both; }
    .panel .hero-index { color: var(--muted); }
    .panel h1 { font-family: var(--head); text-transform: uppercase; font-size: clamp(56px, 9vw, 140px); line-height: 0.85; margin: 18px 0; }
    .panel h1 span { display: block; animation: slab 0.9s var(--snap) both; animation-delay: 0.9s; }
    .panel h1 span + span { -webkit-text-stroke: 2px var(--text); color: transparent; margin-left: 0.5em; animation-delay: 1.02s; }
    .panel .lead { font-family: var(--serif); font-style: italic; font-size: 26px; color: #9aa7b8; max-width: 30ch; margin: 0 0 32px; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; border-top: 2px solid var(--border); padding-top: 20px; }
    .row a { color: var(--text); text-decoration: none; display: inline-grid; place-items: center; }
    .soon { margin-left: auto; font-size: 12px; letter-spacing: 0.14em; color: var(--muted); text-transform: uppercase; }
    .soon b { color: var(--text); animation: blinkDot 1s steps(1) infinite; }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"><div class="grain"></div></div>
  <div class="arrive" aria-hidden="true"></div>
  <main class="stage">
    <div class="tunnel" aria-hidden="true"></div>
    <section class="panel">
      <p class="hero-index">№ 002 · ДРУГАЯ СТОРОНА</p>
      <h1><span>Новый</span><span>продукт</span></h1>
      <p class="lead">Здесь скоро будет презентация. Пока — тишина перед запуском.</p>
      <div class="row">
        <a class="chip-btn" href="index.html">← Назад в кабинет</a>
        <span class="soon">Статус: в разработке <b>▌</b></span>
      </div>
    </section>
  </main>
</body>
</html>
